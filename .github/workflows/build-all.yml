        go_version: ['1.26.1', '1.25.8', '1.24.13', '1.23.12', '1.22.12', '1.21.13', '1.20.14']
        android_target:
          - arch: arm64
            arch_name: arm64-v8a
          - arch: arm
            arch_name: armeabi-v7a
          - arch: amd64
            arch_name: x86_64
    steps:

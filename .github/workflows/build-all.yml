      - name: Build Android core
        run: dart setup.dart android --arch ${{ matrix.android_target.arch }} --out core

      - name: Upload Android core artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-core-go${{ matrix.go_version }}-${{ matrix.android_target.arch_name }}
          path: |
            ./libclash/android/${{ matrix.android_target.arch_name }}/libclash.so

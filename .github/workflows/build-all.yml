name: build

on:
  push:
    branches:
      - 'alpha-xhttp-fldev1'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      kkihos_repository:
        description: 'Kernel repository (owner/name)'
        required: false
        default: 'Amarxisoc/kkihos'
      kkihos_ref:
        description: 'Kernel branch/tag/ref'
        required: false
        default: 'alpha-xhttp-dev2'
env:
  IS_STABLE: ${{ !contains(github.ref, '-') }}
  KKIHOS_REPOSITORY: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.kkihos_repository || 'Amarxisoc/kkihos' }}
  KKIHOS_REF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.kkihos_ref || 'alpha-xhttp-dev2' }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
          - platform: windows
            os: Windows-2022
            arch: amd64
          - platform: linux
            os: ubuntu-22.04
            arch: amd64
          - platform: macos
            os: macos-15-intel
            arch: amd64
          - platform: macos
            os: macos-latest
            arch: arm64
          #          - platform: windows
          #            os: windows-11-arm
          #            arch: arm64
          - platform: linux
            os: ubuntu-24.04-arm
            arch: arm64

    steps:
      - name: Setup rust
        if: startsWith(matrix.os, 'windows-11-arm')
        run: |
          Invoke-WebRequest -Uri "https://win.rustup.rs/aarch64" -OutFile rustup-init.exe
          .\rustup-init.exe -y --default-toolchain stable
          $cargoPath = "$env:USERPROFILE\.cargo\bin"
          Add-Content $env:GITHUB_PATH $cargoPath

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Sync submodules over HTTPS
        shell: bash
        run: |
          git config --global url."https://github.com/".insteadOf git@github.com:
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1

      - name: Checkout kkihos
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KKIHOS_REPOSITORY }}
          ref: ${{ env.KKIHOS_REF }}
          path: core/kkihos

      - name: Setup Android Signing
        if: startsWith(matrix.platform,'android')
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 --decode > android/app/keystore.jks
          echo "${{ secrets.SERVICE_JSON }}" | base64 --decode > android/app/google-services.json
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/local.properties
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" >> android/local.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/local.properties

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache-dependency-path: |
            core/go.sum

      - name: Patch kernel replace path
        working-directory: core
        run: go mod edit -replace github.com/metacubex/mihomo=./kkihos

      - name: Verify kkihos linkage
        shell: bash
        working-directory: core
        run: |
          set -euo pipefail
          echo "KKIHOS_REPOSITORY=${{ env.KKIHOS_REPOSITORY }}"
          echo "KKIHOS_REF=${{ env.KKIHOS_REF }}"
          git -C ./kkihos rev-parse --short HEAD
          mod_dir="$(go list -m -f '{{.Dir}}' github.com/metacubex/mihomo)"
          echo "mihomo module dir: ${mod_dir}"
          case "$mod_dir" in
            *"/kkihos"|*"\\kkihos") ;;
            *) echo "Kernel is not linked to ./kkihos"; exit 1 ;;
          esac

      - name: Setup Flutter
        if: ${{ !(startsWith(matrix.os, 'windows-11-arm') || startsWith(matrix.os, 'ubuntu-24.04-arm')) }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.7
          cache: true
      - name: Setup Flutter With Other
        if: startsWith(matrix.os, 'windows-11-arm') || startsWith(matrix.os, 'ubuntu-24.04-arm')
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: 3.35.7
          cache: true

      - name: Get Flutter Dependency
        run: |
          flutter --version
          flutter pub get

      - name: Setup
        run: dart setup.dart ${{ matrix.platform }} ${{ matrix.arch && format('--arch {0}', matrix.arch) }} ${{ env.IS_STABLE == 'true' && '--env stable' || '' }}

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ matrix.platform }}${{ matrix.arch && format('-{0}', matrix.arch) }}
          path: ./dist
          overwrite: true

  build_core_matrix:
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == 'alpha-xhttp-fldev1' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go_version: ['1.26.1', '1.25.8', '1.24.13', '1.23.12', '1.22.12', '1.21.13', '1.20.14']
        target:
          - goos: windows
            goarch: amd64
            ext: .exe
          - goos: windows
            goarch: arm64
            ext: .exe
          - goos: darwin
            goarch: amd64
            ext: ''
          - goos: darwin
            goarch: arm64
            ext: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout kkihos
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KKIHOS_REPOSITORY }}
          ref: ${{ env.KKIHOS_REF }}
          path: core/kkihos

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go_version }}
          cache-dependency-path: |
            core/go.sum

      - name: Patch kernel replace path
        working-directory: core
        run: go mod edit -replace github.com/metacubex/mihomo=./kkihos

      - name: Verify kkihos linkage
        shell: bash
        working-directory: core
        run: |
          set -euo pipefail
          echo "KKIHOS_REPOSITORY=${{ env.KKIHOS_REPOSITORY }}"
          echo "KKIHOS_REF=${{ env.KKIHOS_REF }}"
          git -C ./kkihos rev-parse --short HEAD
          mod_dir="$(go list -m -f '{{.Dir}}' github.com/metacubex/mihomo)"
          echo "mihomo module dir: ${mod_dir}"
          case "$mod_dir" in
            *"/kkihos"|*"\\kkihos") ;;
            *) echo "Kernel is not linked to ./kkihos"; exit 1 ;;
          esac

      - name: Build core
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build_artifacts/gha-core
          out="build_artifacts/gha-core/FlClashCore-go${{ matrix.go_version }}-${{ matrix.target.goos }}-${{ matrix.target.goarch }}${{ matrix.target.ext }}"
          GOOS=${{ matrix.target.goos }} GOARCH=${{ matrix.target.goarch }} CGO_ENABLED=0 \
            go build -ldflags='-w -s' -tags='with_gvisor' -o "../$out" .
          ls -lh "../$out"
        working-directory: core

      - name: Upload core artifact
        uses: actions/upload-artifact@v4
        with:
          name: core-go${{ matrix.go_version }}-${{ matrix.target.goos }}-${{ matrix.target.goarch }}
          path: build_artifacts/gha-core/FlClashCore-go${{ matrix.go_version }}-${{ matrix.target.goos }}-${{ matrix.target.goarch }}${{ matrix.target.ext }}
          overwrite: true

